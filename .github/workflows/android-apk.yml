name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, android-playable-20260916]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - run: npm ci
      - run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - run: node scripts/configure-android.mjs
      - run: chmod +x android/gradlew
      - run: ./android/gradlew --no-daemon assembleDebug

      - name: Upload playable APK
        uses: actions/upload-artifact@v4
        with:
          name: THOTSL4YER69-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
