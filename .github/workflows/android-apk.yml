name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, android-playable-20260916]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK using current command-line tools
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK missing}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - run: npm ci
      - run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - run: node scripts/configure-android.mjs
      - run: chmod +x android/gradlew && cd android && ./gradlew --no-daemon assembleDebug

      - name: Upload playable APK
        uses: actions/upload-artifact@v4
        with:
          name: THOTSL4YER69-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
